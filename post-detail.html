<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Post | T.B.E Bazuri</title>
  <meta name="description" id="metaDescription" content="">
  <meta property="og:title" id="ogTitle" content="">
  <meta property="og:description" id="ogDescription" content="">
  <meta property="og:type" content="article">
  <meta property="og:url" id="ogUrl" content="">
  <meta property="og:image" id="ogImage" content="https://joemovesz.github.io/t.b.e-project/logo/t.b.e_logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twitterTitle" content="">
  <meta name="twitter:description" id="twitterDescription" content="">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="logo/t.b.e_logo.png">
  <meta name="theme-color" content="#2563eb">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900">
  <nav class="navbar bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
    <div class="container">
      <a href="index.html" class="logo">T<span class="text-gray-800">.</span>B<span class="text-gray-800">.</span>E Bazuri</a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="text-gray-600 hover:text-blue-600 font-medium">← Back to Home</a>
        <span id="authLink"></span>
      </div>
    </div>
  </nav>
  <section class="post-detail-header">
    <div class="container">
      <div class="post-detail-meta">
        <span id="postTypeBadge" class="badge"></span>
        <span class="text-gray-500 text-sm" id="postDate"></span>
        <span class="text-gray-500 text-sm" id="postViews">👁️ <span id="viewCount">0</span> views</span>
      </div>
      <h1 class="post-detail-title" id="postTitle"></h1>
      <div class="post-detail-actions">
        <button class="like-btn" id="likeBtn" onclick="handleLikeDetail()" aria-label="Like post">
          <span class="heart-icon">❤️</span>
          <span class="like-count">0</span>
        </button>
        <div class="share-dropdown relative">
          <button id="shareBtn" class="btn btn-outline px-6 py-2.5 text-sm" aria-label="Share post" aria-haspopup="true" aria-expanded="false">Share</button>
          <div id="shareMenu" class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg dark:bg-gray-800 dark:border-gray-600 z-50">
            <button onclick="shareTo('facebook')" class="w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">📘 Facebook</button>
            <button onclick="shareTo('twitter')" class="w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">🐦 Twitter/X</button>
            <button onclick="shareTo('whatsapp')" class="w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">📱 WhatsApp</button>
            <button onclick="shareTo('copy')" class="w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">🔗 Copy Link</button>
          </div>
        </div>
      </div>
      <div id="postMedia" class="post-detail-media"></div>
      <div class="post-detail-body" id="postBody"></div>
    </div>
  </section>
  <!-- Giscus Comments -->
  <section class="giscus-comments">
    <div class="container">
      <div class="post-detail-content">
        <h3 class="text-xl font-bold text-gray-900 mb-6">Comments</h3>
        <div class="giscus-container">
          <script src="https://giscus.app/client.js"
            data-repo="joemovesz/t.b.e-project"
            data-repo-id="R_kgDOVZMFuA"
            data-category="[ENTER CATEGORY NAME HERE]"
            data-category-id="[ENTER CATEGORY ID HERE]"
            data-mapping="url"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="en"
            crossorigin="anonymous"
            async>
          </script>
        </div>
        <p class="mt-4 text-sm text-gray-500 text-center"><em>Comments powered by GitHub Discussions (Giscus). Sign in to GitHub to comment.</em></p>
      </div>
    </div>
  </section>
  <footer class="border-t border-gray-200 bg-white py-8 mt-12">
    <div class="container"><p class="text-gray-500 text-sm text-center">&copy; 2026 T.B.E Bazuri. All rights reserved.</p></div>
  </footer>
  <script src="js/app.js"></script>
  <script src="js/lightbox.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get("id");
      if (!postId) { window.location.href = "index.html"; return; }
      const post = getPostById(postId);
      if (!post) {
        document.body.innerHTML = "<div class='container text-center py-20'><h2 class='text-2xl font-bold text-gray-900'>Post not found</h2><p class='text-gray-500 mt-4'>The post doesn't exist.</p><a href='index.html' class='btn btn-primary mt-6'>Go Home</a></div>";
        return;
      }
      const authLink = document.getElementById("authLink");
      if (isAdmin()) { authLink.innerHTML = "<a href='#' onclick='logout()' class='text-gray-600 hover:text-red-600 font-medium px-3 py-1 rounded hover:bg-red-50'>Logout</a>"; }
      else { authLink.innerHTML = "<a href='admin-login.html' class='text-gray-600 hover:text-blue-600 font-medium px-3 py-1 rounded hover:bg-blue-50'>Admin Login</a>"; }
      // Increment and display view count
      const viewCount = incrementViews(postId);
      document.getElementById("viewCount").textContent = viewCount;

      // Set dynamic SEO meta tags
      document.getElementById("pageTitle").textContent = `${post.title} | T.B.E Bazuri`;
      document.getElementById("metaDescription").content = post.content.substring(0, 160) + (post.content.length > 160 ? "…" : "");
      document.getElementById("ogTitle").content = post.title;
      document.getElementById("ogDescription").content = post.content.substring(0, 160) + (post.content.length > 160 ? "…" : "");
      document.getElementById("ogUrl").content = window.location.href;
      document.getElementById("twitterTitle").content = post.title;
      document.getElementById("twitterDescription").content = post.content.substring(0, 160) + (post.content.length > 160 ? "…" : "");

      document.getElementById("postTitle").textContent = post.title;
      document.getElementById("postDate").textContent = formatDate(post.createdAt);
      document.getElementById("postBody").textContent = post.content;
      const typeBadge = document.getElementById("postTypeBadge");
      typeBadge.className = "badge badge-" + post.type;
      typeBadge.textContent = post.type.toUpperCase();
      const mediaEl = document.getElementById("postMedia");
      if (post.type === "video" && post.mediaUrl) {
        const videoId = extractYouTubeId(post.mediaUrl);
        if (videoId) { mediaEl.innerHTML = '<iframe src="https://www.youtube.com/embed/' + videoId + '" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>'; }
        else { mediaEl.innerHTML = '<video src="' + escapeHtml(post.mediaUrl) + '" controls class="w-full h-full object-cover"></video>'; }
      } else if (post.type === "image" && post.mediaUrl) {
        mediaEl.innerHTML = '<img src="' + escapeHtml(post.mediaUrl) + '" alt="' + escapeHtml(post.title) + '" class="w-full h-full object-cover">';
      } else {
        mediaEl.innerHTML = '<div class="flex items-center justify-center h-full bg-gray-100 text-gray-400 text-sm">No media attached</div>';
      }
      const likeBtn = document.getElementById("likeBtn");
      const countEl = likeBtn.querySelector(".like-count");
      const heartEl = likeBtn.querySelector(".heart-icon");
      const liked = hasUserLiked(postId);
      const likeCount = getLikeCount(postId);
      countEl.textContent = likeCount;
      heartEl.textContent = liked ? "❤️" : "🤍";
      if (liked) likeBtn.classList.add("liked");
      window.handleLikeDetail = function() {
        const result = toggleLike(postId);
        countEl.textContent = result.likes;
        heartEl.textContent = result.liked ? "❤️" : "🤍";
        if (result.liked) likeBtn.classList.add("liked"); else likeBtn.classList.remove("liked");
      };
      // Share functionality
      const shareBtn = document.getElementById("shareBtn");
      const shareMenu = document.getElementById("shareMenu");
      const postUrl = window.location.href;
      const postTitle = post.title;

      shareBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        shareMenu.classList.toggle("hidden");
        const expanded = shareBtn.getAttribute("aria-expanded") === "true";
        shareBtn.setAttribute("aria-expanded", !expanded);
      });

      document.addEventListener("click", (e) => {
        if (!shareBtn.contains(e.target) && !shareMenu.contains(e.target)) {
          shareMenu.classList.add("hidden");
          shareBtn.setAttribute("aria-expanded", "false");
        }
      });

      window.shareTo = function(platform) {
        const text = encodeURIComponent(postTitle);
        const url = encodeURIComponent(postUrl);
        let shareUrl = "";

        if (platform === "facebook") {
          shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
        } else if (platform === "twitter") {
          shareUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
        } else if (platform === "whatsapp") {
          shareUrl = `https://wa.me/?text=${text}%20${url}`;
        } else if (platform === "copy") {
          navigator.clipboard.writeText(postUrl).then(() => {
            showToast("Link copied to clipboard!", "success");
          }).catch(() => {
            showToast("Failed to copy link.", "error");
          });
          shareMenu.classList.add("hidden");
          shareBtn.setAttribute("aria-expanded", "false");
          return;
        }

        if (shareUrl) {
          window.open(shareUrl, "_blank", "width=600,height=400");
        }
        shareMenu.classList.add("hidden");
        shareBtn.setAttribute("aria-expanded", "false");
      };

      document.getElementById("shareBtn").href = window.location.href;
    });
    function extractYouTubeId(url) { const match = url.match(/(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/); return match ? match[1] : null; }
    function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }

    // Initialize theme
    const theme = getTheme();
    if (theme === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>
</body>
</html>
