<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | T.B.E Bazuri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900">
  <nav class="navbar bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
    <div class="container">
      <a href="index.html" class="logo">T<span class="text-gray-800">.</span>B<span class="text-gray-800">.</span>E Bazuri</a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="text-gray-600 hover:text-blue-600 font-medium">← Back to Home</a>
        <span id="authLink"></span>
      </div>
    </div>
  </nav>

  <div class="container py-12">
    <div class="text-center py-20">
      <div class="text-6xl font-bold text-gray-200 mb-4">404</div>
      <h1 class="text-3xl font-bold text-gray-900 mb-4">Page Not Found</h1>
      <p class="text-gray-500 mb-8">The page you're looking for doesn't exist or has been moved.</p>
      <a href="index.html" class="btn btn-primary px-8 py-3">Go Home</a>
    </div>
  </div>

  <footer class="border-t border-gray-200 bg-white py-8 mt-12">
    <div class="container">
      <p class="text-gray-500 text-sm text-center">&copy; 2026 T.B.E Bazuri. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/toast.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const authLink = document.getElementById("authLink");
      if (isAdmin()) {
        authLink.innerHTML = "<a href='#' onclick='logout()' class='text-gray-600 hover:text-red-600 font-medium px-3 py-1 rounded hover:bg-red-50'>Logout</a>";
      } else {
        authLink.innerHTML = "<a href='admin-login.html' class='text-gray-600 hover:text-blue-600 font-medium px-3 py-1 rounded hover:bg-blue-50'>Admin Login</a>";
      }
    });
  </script>
</body>
</html>
