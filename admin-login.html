<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | T.B.E Bazuri</title>
  <meta name="description" content="Admin login for T.B.E Bazuri.">
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="logo/t.b.e_logo.png">
  <meta name="theme-color" content="#2563eb">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50">

  <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
      <div>
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900 tracking-tight">
          Admin Login
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
          Only <strong>tebangenebazuri@gmail.com</strong> can access the admin panel.
        </p>
      </div>

      <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-gray-200">
        <form id="loginForm" class="space-y-6">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
            <div class="mt-1">
              <input id="email" name="email" type="email" required
                class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                placeholder="tebangenebazuri@gmail.com">
            </div>
          </div>

          <div>
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
              Enter Admin Panel
            </button>
          </div>

          <p id="errorMsg" class="text-sm text-red-600 text-center hidden mt-2">
            Invalid email. Only the authorized admin email is allowed.
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Initialize theme
      const theme = getTheme();
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }

      // If already logged in, redirect to dashboard
      if (isAdmin()) {
        window.location.href = "admin-dashboard.html";
      }

      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const errorMsg = document.getElementById("errorMsg");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        errorMsg.classList.add("hidden");

        const email = emailInput.value.trim();
        if (login(email)) {
          window.location.href = "admin-dashboard.html";
        } else {
          errorMsg.classList.remove("hidden");
          emailInput.focus();
        }
      });
    });
  </script>
</body>
</html>
