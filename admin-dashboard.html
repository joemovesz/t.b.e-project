<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | T.B.E Bazuri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- Navbar -->
  <nav class="navbar bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
    <div class="container">
      <a href="admin-dashboard.html" class="logo">T<span class="text-gray-800">.</span>B<span class="text-gray-800">.</span>E Bazuri</a>

      <div class="nav-links">
        <a href="index.html" class="text-gray-600 hover:text-blue-600 font-medium">View Site</a>
        <a href="create-post.html" class="text-blue-600 hover:text-blue-700 font-medium">+ Create Post</a>
        <a href="#" onclick="logout()" class="text-gray-600 hover:text-red-600 font-medium px-3 py-1 rounded hover:bg-red-50">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container py-8">
    <div class="page-header">
      <div>
        <h2 class="text-2xl font-bold text-gray-900">Admin Dashboard</h2>
        <p class="text-gray-500 text-sm">Manage your published content</p>
      </div>
      <a href="create-post.html" class="btn btn-primary px-6 py-2.5">
        <span>+ New Post</span>
      </a>
    </div>

    <div id="alertContainer"></div>

    <div class="post-list" id="postList">
      <!-- Posts injected here -->
    </div>

    <div id="emptyState" class="empty-state hidden py-12">
      <h3 class="text-xl font-bold text-gray-900 mb-2">No posts yet</h3>
      <p class="text-gray-500">Create your first post to get started.</p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      requireAdmin();
      renderDashboard();
    });
  </script>
</body>
</html>
